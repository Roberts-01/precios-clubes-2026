  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      padding: 25px 15px;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header p {
      color: #64748b;
      font-size: 1rem;
      font-weight: 600;
    }
    .tabs-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tab-button {
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      background: #ffffff;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-button.active {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
      box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3);
    }
    .search-card {
      background: #ffffff;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    @media (min-width: 600px) {
      .search-card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    .search-input:focus {
      border-color: #dc2626;
    }
    .counter-badge {
      font-size: 0.9rem;
      font-weight: bold;
      color: #64748b;
      white-space: nowrap;
    }
    .table-container {
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      color: #475569;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    tbody tr:hover {
      background-color: #f8fafc;
    }
    .col-code {
      font-family: monospace;
      color: #64748b;
      font-weight: bold;
      width: 120px;
    }
    .col-price {
      text-align: right;
      font-weight: bold;
      color: #047857;
      width: 150px;
    }
    th.col-price {
      text-align: right;
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: #64748b;
      display: none;
    }}
  </style>
</head>

    let clubActual = 'Chapalita';

    const formato = new Intl.NumberFormat('es-MX', {
      style: 'currency',
      currency: 'MXN',
      minimumFractionDigits: 0
    });

    function cambiarClub(club) {
      clubActual = club;
      document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.trim() === club);
      });
      document.getElementById('buscador').value = '';
      filtrar();
    }

    function filtrar() {
      const termino = document.getElementById('buscador').value.toLowerCase().trim();
      const listaOriginal = DATA_PRECIOS[clubActual] || [];

      const filtrados = listaOriginal.filter(item => {
        const c = String(item.codigo || '').toLowerCase();
        const d = String(item.descripcion || '').toLowerCase();
        return c.includes(termino) || d.includes(termino);
      });

      renderizar(filtrados);
    }

    function renderizar(datos) {
      const tbody = document.getElementById('tabla-cuerpo');
      const vacio = document.getElementById('sin-resultados');
      const contador = document.getElementById('contador');

      tbody.innerHTML = '';
      contador.textContent = `${datos.length} concepto(s)`;

      if (datos.length === 0) {
        vacio.style.display = 'block';
        return;
      }
      vacio.style.display = 'none';

      const fragment = document.createDocumentFragment();
      datos.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="col-code">${item.codigo}</td>
          <td>${item.descripcion}</td>
          <td class="col-price">${formato.format(item.precio)}</td>
        `;
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

    window.onload = function() {
      cambiarClub('Chapalita');
    };
